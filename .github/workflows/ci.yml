name: ci
on: [pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: 07-week-7-clean-architecture

    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
